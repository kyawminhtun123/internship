<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding:0px;
        margin:0px;
        box-sizing: border-box;
    }
    body{
        background-color: beige;
        padding: 30px;
    }
    .allauto{
        max-width: 800px;
        margin:auto;
    }
    .nav{
        background-color: rgb(151, 98, 30);
        display: flex;
        justify-content: space-between;
    }
    h2{
        color:aliceblue;
    }
    a{
        text-decoration: none;
        margin-left:20px;
        color:white;

    }
    .feature{
        margin-top: 10px;
        display: flex;
        gap:20px;
        margin-bottom: 25px;
    }
    span{
        width:300px;
        background-color: darkcyan;
        text-align: center;
        padding: 15px;

    }
    .container{
        display: flex;
        justify-content: center;
        gap:20px;
    }
    .left-side{
        width: 50%;
        padding-left:5px;
        /* line-height: 25px; */
        /* border:2px solid green; */
        background-color: rgb(133, 133, 251);
        border-radius: 5px;
    }
    .right-side{
        width:50%;
        height: 150px;
        margin-top: 20%;
        /* border:3px solid green; */
        background-color: rgb(133, 251, 198);
        border-radius: 5px;
    }
    .walk{
        background-color: rgb(77, 42, 165);
        /* padding: 30px; */
        text-align: center;
        border-radius: 5px;
        /* padding-top:50px;
        padding-left: 50px;
        padding-right: 50px;
        padding-bottom: 50px;
        width: 50%;
        height: 50%; */
        display: flex;
        justify-content: center;
        text-align: center;
    }
    option{
        width:200px;
    }
    .opt label{
        display: block;
        margin-bottom: 6px;   

    }
    .opt select{
        width:100%;
        padding:10px;
        border:1px solid greenyellow;
        border-radius: 4px;
    }
    button{
        margin:20px;
        background-color: rgb(44, 8, 151);
        width:150px;
        height:50px;
        border:2px solid greenyellow;
        border-radius: 5px;
    }

</style>
<body>
    <div class="allauto">
<h1>CSS Utility Simulator</h1>
    <p>Change the inputs below to see how atomic classes combine to build UIs.</p> 
    <div class="nav">
        <h2>MyLogo</h2>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
    <div class="feature">
        <span>Feature1</span>
        <span>Feature2</span>
        <span>Feature3</span>
    </div>
    <div class="container">
     <section class="left-side">
        <h2>Utility Controls</h2>
        <div class="opt"> <label>Padding (Spacing)</label>
            <select>
                 <option>Medium(p-8)</option>
            </select>
        </div> 
        <div class="opt"><label>Background Theme(Colors)</label>
            <select>
                <option>Primary Blue</option>
            </select>
        </div> 
        <div class="opt"><label>Text Size(Typography)</label> 
            <select>
                <option>Large(text-x)</option>
            </select>
        </div> 
        <div class="opt"><label>Corner Radius (Border)</label> 
            <select>
                <option>Square(rounded-none) </option>
            </select>
        </div> 
        <div class="opt"><label>Shadow(Depth)</label>
            <select>
                 <option>Medium(Shadow-md)</option>
            </select>
        </div> 
    </section>
    <div class="walk">
        <section class="right-side">
        <h1>Alex Walker</h1>
        <p>Full-Stack Web Developer building awesome things with Taiwind CSS.</p>
    </section>
    </div>
    </div>
    <section>
        <button>Submit</button>
        <button>Hover Me Slowly!</button>
    </section>
    </div>
</body>
</html>
